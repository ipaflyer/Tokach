<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Обвод</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <style>
    :root {
      --ink: #e8f6ff;
      --muted: #9bb0c9;
      --cyan: #5eead4;
      --gold: #ffd166;
      --pink: #e879f9;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #070815;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .top {
      position: absolute;
      left: 20px;
      top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .brand {
      font-size: 22px;
      letter-spacing: 0.28em;
      font-weight: 800;
      color: #ecfeff;
      text-shadow: 0 0 18px rgba(94, 234, 212, 0.65);
    }
    .trail {
      width: 240px;
      height: 10px;
      border: 1px solid rgba(94, 234, 212, 0.5);
      background: rgba(8, 16, 32, 0.7);
      overflow: hidden;
    }
    #trailFill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #22d3ee, #a3e635);
      box-shadow: 0 0 12px #22d3ee;
    }
    #eventLog {
      font-size: 15px;
      color: #fef9c3;
      text-shadow: 0 1px 8px #000;
      min-height: 1.2em;
    }
    .bottom {
      position: absolute;
      left: 20px;
      bottom: 16px;
      color: var(--muted);
      font-size: 14px;
    }
    #cargoState.held { color: var(--gold); }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(94, 234, 212, 0.12), transparent 28%),
        radial-gradient(circle at 80% 70%, rgba(232, 121, 249, 0.12), transparent 30%),
        rgba(5, 7, 16, 0.38);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .card {
      width: min(520px, 92vw);
      padding: 28px 30px 24px;
      background: linear-gradient(180deg, rgba(24, 32, 64, 0.95), rgba(12, 16, 32, 0.95));
      border: 1px solid rgba(94, 234, 212, 0.35);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.45), 0 0 40px rgba(94, 234, 212, 0.12);
    }
    .card h1 {
      margin: 0 0 8px;
      letter-spacing: 0.32em;
      font-size: 28px;
    }
    .card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.45;
    }
    .card button, #selfCheckBtn {
      pointer-events: auto;
      border: 0;
      cursor: pointer;
      padding: 10px 16px;
      background: #5eead4;
      color: #042f2e;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .card button:hover { filter: brightness(1.08); }
    #selfCheckBtn {
      position: fixed;
      right: 16px;
      bottom: 16px;
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.8);
      color: #cbd5e1;
      border: 1px solid #334155;
      font-weight: 600;
    }
    #selfCheckOut {
      position: fixed;
      right: 16px;
      bottom: 56px;
      max-width: 420px;
      white-space: pre-wrap;
      font: 12px/1.35 ui-monospace, monospace;
      color: #cbd5e1;
      pointer-events: none;
      text-shadow: 0 1px 6px #000;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="top">
      <div class="brand">ОБВОД</div>
      <div class="trail" title="длина черты"><div id="trailFill"></div></div>
      <div id="eventLog">замкни черту — дом ответит</div>
    </div>
    <div class="bottom">
      <div id="cargoState">груз в кладовой</div>
      <div id="hint">WASD / стрелки — идти · Пробел — бросить черту</div>
    </div>
  </div>
  <div id="overlay">
    <div class="card">
      <h1 id="overlayTitle">ОБВОД</h1>
      <p id="overlayText">Ты ведёшь черту ногами. Замкни контур — дом прочитает, что внутри: пустота станет печатью, сгусток сгорит, груз возьмётся. Сзади район отмирает. Выйди с грузом тем же входом.</p>
      <button type="button" id="overlayBtn">Идти</button>
    </div>
  </div>
  <pre id="selfCheckOut"></pre>
  <button type="button" id="selfCheckBtn">Самопроверки</button>
  <script src="src/geometry.js"></script>
  <script src="src/rules.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
